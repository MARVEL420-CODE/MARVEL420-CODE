<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gradSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="660" fill="#0B1120" rx="20"/>

  <!-- Connector lines (drawn first, under the boxes) -->
  <g stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <!-- User Query -> LLM/Agent -->
    <line x1="450" y1="78" x2="450" y2="112"/>
    <!-- LLM/Agent -> three branches -->
    <path d="M450,178 L450,200 L160,200 L160,222"/>
    <path d="M450,178 L450,222"/>
    <path d="M450,178 L450,200 L740,200 L740,222"/>
    <!-- Embeddings + Vector Store -> Semantic Retrieval -->
    <path d="M160,278 L160,300 L300,300 L300,322"/>
    <path d="M450,278 L450,300 L300,300"/>
    <!-- Tool/SQL -> Live Execution -->
    <line x1="740" y1="278" x2="740" y2="322"/>
    <!-- Semantic Retrieval + Live Execution -> Context-Aware Answer -->
    <path d="M300,378 L300,420 L450,420 L450,442"/>
    <path d="M740,378 L740,420 L450,420"/>
    <!-- Context-Aware Answer -> Intelligent AI App -->
    <line x1="450" y1="498" x2="450" y2="532"/>
  </g>

  <!-- USER QUERY -->
  <g filter="url(#glow)">
    <rect x="350" y="30" width="200" height="48" rx="24" fill="url(#gradPrimary)"/>
  </g>
  <text x="450" y="59" text-anchor="middle" fill="#0B1120" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">USER QUERY</text>

  <!-- LLM / AGENT -->
  <g filter="url(#glow)">
    <rect x="330" y="112" width="240" height="66" rx="16" fill="url(#gradSoft)" stroke="url(#gradPrimary)" stroke-width="2.5"/>
  </g>
  <text x="450" y="139" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">LLM / AGENT</text>
  <text x="450" y="160" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">orchestrates the pipeline</text>

  <!-- Row 3: Embeddings / Vector Store / Tool-SQL -->
  <rect x="70" y="222" width="180" height="56" rx="14" fill="#0F172A" stroke="#00D9FF" stroke-width="2"/>
  <text x="160" y="256" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Embeddings</text>

  <rect x="360" y="222" width="180" height="56" rx="14" fill="#0F172A" stroke="#2563EB" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Vector Store</text>

  <rect x="650" y="222" width="180" height="56" rx="14" fill="#0F172A" stroke="#7C3AED" stroke-width="2"/>
  <text x="740" y="256" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Tool / SQL</text>

  <!-- Row 4: Semantic Retrieval / Live Execution -->
  <g filter="url(#glow)">
    <rect x="200" y="322" width="200" height="56" rx="14" fill="url(#gradPrimary)"/>
  </g>
  <text x="300" y="356" text-anchor="middle" fill="#0B1120" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Semantic Retrieval</text>

  <g filter="url(#glow)">
    <rect x="640" y="322" width="200" height="56" rx="14" fill="url(#gradPrimary)"/>
  </g>
  <text x="740" y="356" text-anchor="middle" fill="#0B1120" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Live Execution</text>

  <!-- Context-Aware Answer -->
  <g filter="url(#glow)">
    <rect x="310" y="442" width="280" height="56" rx="16" fill="url(#gradSoft)" stroke="url(#gradPrimary)" stroke-width="2.5"/>
  </g>
  <text x="450" y="476" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Context-Aware Answer</text>

  <!-- Intelligent AI App -->
  <g filter="url(#glow)">
    <rect x="290" y="532" width="320" height="60" rx="30" fill="url(#gradPrimary)"/>
  </g>
  <text x="450" y="568" text-anchor="middle" fill="#0B1120" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">INTELLIGENT AI APP</text>
</svg>

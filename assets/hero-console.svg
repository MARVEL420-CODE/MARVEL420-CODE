<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0B121C"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1C7A54"/>
      <stop offset="100%" stop-color="#39FF88"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#0F1822" opacity="0.5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="10" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="260" rx="10" fill="url(#scan)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="10" fill="none" stroke="#16202C" stroke-width="1"/>

  <!-- window chrome dots -->
  <circle cx="24" cy="24" r="5" fill="#3A4655"/>
  <circle cx="42" cy="24" r="5" fill="#3A4655"/>
  <circle cx="60" cy="24" r="5" fill="#3A4655"/>
  <text x="80" y="29" font-size="12" fill="#5B6B7D">~/purushoth — agent.console</text>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#16202C" stroke-width="1"/>

  <!-- boot log, left column -->
  <g font-size="14">
    <text x="30" y="80" fill="#7C8B9A">
      &gt; init voice_agent.core
      <tspan fill="#39FF88"> [ OK ]</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.06;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="108" fill="#7C8B9A">
      &gt; mount vector_store('faiss://local')
      <tspan fill="#39FF88"> [ OK ]</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.20;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="136" fill="#7C8B9A">
      &gt; load model('gemini-live-realtime')
      <tspan fill="#39FF88"> [ OK ]</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.30;0.34;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="164" fill="#7C8B9A">
      &gt; connect mqtt('home/automation')
      <tspan fill="#39FF88"> [ OK ]</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.48;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="200" font-size="16" font-weight="600" fill="#FFB300">
      &gt; agent purushoth_p — READY
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.62;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </text>
    <rect x="322" y="188" width="9" height="16" fill="#FFB300">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1" keyTimes="0;0.58;0.62;0.68;0.74;0.80;0.86;0.92;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="30" y="232" font-size="12" fill="#3A4655">stack: python · langchain · livekit · faiss · react</text>

  <!-- waveform, right column -->
  <line x1="470" y1="60" x2="470" y2="210" stroke="#16202C" stroke-width="1"/>
  <text x="640" y="225" font-size="11" fill="#3A4655" text-anchor="middle">voice_agent :: listening</text>

  <g>
    <rect x="500" y="150" width="16" height="40" fill="url(#barGrad)"><animate attributeName="height" values="40;95;25;70;40" dur="1.1s" begin="-0.0s" repeatCount="indefinite"/><animate attributeName="y" values="150;95;165;120;150" dur="1.1s" begin="-0.0s" repeatCount="indefinite"/></rect>
    <rect x="526" y="130" width="16" height="60" fill="url(#barGrad)"><animate attributeName="height" values="60;20;85;45;60" dur="0.95s" begin="-0.15s" repeatCount="indefinite"/><animate attributeName="y" values="130;170;105;145;130" dur="0.95s" begin="-0.15s" repeatCount="indefinite"/></rect>
    <rect x="552" y="100" width="16" height="90" fill="#FFB300"><animate attributeName="height" values="90;40;60;100;90" dur="1.05s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="y" values="100;150;130;90;100" dur="1.05s" begin="-0.3s" repeatCount="indefinite"/></rect>
    <rect x="578" y="140" width="16" height="50" fill="url(#barGrad)"><animate attributeName="height" values="50;85;30;65;50" dur="0.9s" begin="-0.45s" repeatCount="indefinite"/><animate attributeName="y" values="140;105;160;125;140" dur="0.9s" begin="-0.45s" repeatCount="indefinite"/></rect>
    <rect x="604" y="120" width="16" height="70" fill="url(#barGrad)"><animate attributeName="height" values="70;30;95;50;70" dur="1.15s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="y" values="120;160;95;140;120" dur="1.15s" begin="-0.6s" repeatCount="indefinite"/></rect>
    <rect x="630" y="105" width="16" height="85" fill="#FFB300"><animate attributeName="height" values="85;45;70;95;85" dur="1s" begin="-0.75s" repeatCount="indefinite"/><animate attributeName="y" values="105;145;120;95;105" dur="1s" begin="-0.75s" repeatCount="indefinite"/></rect>
    <rect x="656" y="145" width="16" height="45" fill="url(#barGrad)"><animate attributeName="height" values="45;80;25;60;45" dur="0.92s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="y" values="145;110;165;130;145" dur="0.92s" begin="-0.9s" repeatCount="indefinite"/></rect>
    <rect x="682" y="125" width="16" height="65" fill="url(#barGrad)"><animate attributeName="height" values="65;95;35;75;65" dur="1.08s" begin="-1.05s" repeatCount="indefinite"/><animate attributeName="y" values="125;95;155;115;125" dur="1.08s" begin="-1.05s" repeatCount="indefinite"/></rect>
    <rect x="708" y="150" width="16" height="40" fill="url(#barGrad)"><animate attributeName="height" values="40;70;20;55;40" dur="0.97s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="y" values="150;120;170;135;150" dur="0.97s" begin="-1.2s" repeatCount="indefinite"/></rect>
    <rect x="734" y="130" width="16" height="60" fill="url(#barGrad)"><animate attributeName="height" values="60;25;90;40;60" dur="1.02s" begin="-1.35s" repeatCount="indefinite"/><animate attributeName="y" values="130;165;100;140;130" dur="1.02s" begin="-1.35s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="490" y1="200" x2="800" y2="200" stroke="#16202C" stroke-width="1"/>
</svg>
